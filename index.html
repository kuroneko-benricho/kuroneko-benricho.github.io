<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>くろねこ便利帳｜紹介したアイテム</title>
<style>
  :root { --bg:#faf8f5; --card:#fff; --text:#2b2b2b; --muted:#777; --accent:#bf0000; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  header { padding:20px 16px 8px; text-align:center; }
  h1 { font-size:18px; margin:0 0 6px; }
  .note { font-size:12px; color:var(--muted); margin:0; line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 32px;
         display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .card { background:var(--card); border-radius:12px; overflow:hidden; text-decoration:none;
          color:inherit; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; flex-direction:column; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; background:#eee; }
  .body { padding:8px 10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .pr { font-size:10px; color:var(--muted); border:1px solid #ccc; border-radius:4px;
        padding:0 4px; align-self:flex-start; }
  .name { font-size:14px; margin:0; line-height:1.4; flex:1; }
  .btn { background:var(--accent); color:#fff; font-size:13px; text-align:center;
         border-radius:8px; padding:8px 0; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); }
  footer { text-align:center; font-size:11px; color:var(--muted); padding:0 16px 24px; }
</style>
</head>
<body>

  お値段や在庫は、リンク先の楽天市場でご確認ください。</p>
</header>
<main>

      <img src="https://shop.r10s.jp/m-style2021/cabinet/08248474/13931702/imgrc0155758988.jpg" alt="もこもこ ドーム型ペットベッド" loading="lazy">
      <div class="body">
        <span class="pr">PR</span>
        <p class="name">もこもこ ドーム型ペットベッド</p>

    </a>
    <a class="card" href="https://a.r10.to/hgnvNy" target="_blank" rel="sponsored noopener">

      <div class="body">

        <span class="btn">楽天で見る</span>

    </a>
</main>

</html>
